[pytest]
testpaths = tests
# pytest's default fd-level capture swaps file descriptors 0-2 under Tk; on Windows a
# new Tk() then intermittently fails to read its own scripts ("Can't find a usable
# tk.tcl", "couldn't read file .../auto.tcl"). Measured here: 16 of 25 fresh runs
# failed that way with the default, 0 of 25 with sys-level capture, which leaves the
# descriptors alone. (python -m unittest discover is unaffected either way.)
addopts = --capture=sys -p no:cacheprovider
